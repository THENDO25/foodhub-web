<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login and Sign Up</title>

  <link rel="stylesheet" href="../shared/navbar.css" />
  <link rel="stylesheet" href="../shared/login.css" />
  <link rel="stylesheet" href="../shared/responsive.css">

  <script src="../shared/api.js"></script>
  <script src="../shared/session.js"></script>
  <script src="auth.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

  <script src="../shared/navbar.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@2.1.2/css/boxicons.min.css">
</head>

<body>

  <header class="header" id="home">

    <a href="../home/index.html" class="logo">
      Food<span>Hub</span>
    </a>

    <nav class="navbar">

      <div id="menu-toggle" class="menu-icon" aria-label="Toggle navigation">
        <i id="hamburger-icon" class="fa fa-bars" aria-hidden="true"></i>

        <i id="close-icon" class="fa fa-times" aria-hidden="true" style="display: none;"></i>
      </div>

      <div class="navbar-links">

        <ul>
          <li>
            <a href="../home/index.html">Home</a>
          </li>

          <li>
            <a href="../menu/index.html">Menu</a>
          </li>

          <li>
            <a href="../manage-account/profile.html">Account</a>
          </li>

          <li>
            <a href="../reviews/index.html">Reviews</a>
          </li>

          <li>
            <a href="../cart/index.html">Cart</a>
          </li>
        </ul>

      </div>

    </nav>

    <a href="login.html" class="btn auth-btn" id="auth-btn">Sign in</a>

  </header>


  <div class="container">

    <!-- Login -->
    <div class="form-container" id="login-form">

      <h2>Login</h2>

      <form id="loginForm">

        <input type="email" id="login-email" placeholder="Email" required>

        <div class="password-wrapper">

          <input type="password" placeholder="Password" id="login-password" required>

          <i class="fa fa-eye" id="toggle-login-password" style="cursor: pointer;"></i>

        </div>

        <div class="rm">

          <div class="rmb-pass">

            <label class="remember-pass">
              <input type="checkbox" id="remember-me" />
            </label>

            <h2 class="remember-me-text">
              Remember Password
            </h2>

          </div>

          <p class="forgotpass">
            forgotten password
          </p>

        </div>

        <button type="submit">
          Login
        </button>

        <p class="switch-form">
          Don't have an account?
          <a href="#" id="switch-to-signup">
            Sign Up
          </a>
        </p>

      </form>

    </div>


    <!-- Sign Up -->
    <div class="form-container" id="signup-form" style="display: none;">

      <h2>Sign Up</h2>

      <form id="signupForm">

        <input type="text" id="signup-name" placeholder="Full name" required minlength="2">

        <input type="email" id="signup-email" placeholder="Email" required>

        <div class="password-wrapper">

          <input type="password" placeholder="Password" id="signup-password" required>

          <i class="fa fa-eye" id="toggle-signup-password" style="cursor: pointer;"></i>

        </div>

        <div class="password-wrapper">

          <input type="password" placeholder="Confirm Password" id="confirm-password" required>

          <i class="fa fa-eye" id="toggle-confirm-password" style="cursor: pointer;"></i>

        </div>

        <button type="submit">
          Sign Up
        </button>

        <p class="switch-form">
          Already have an account?
          <a href="#" id="switch-to-login">
            Login
          </a>
        </p>

      </form>

    </div>

  </div>


  <script>
    // Switch between the login and registration forms.
    document.getElementById("switch-to-signup").addEventListener("click", function (event) {
      event.preventDefault();
      document.getElementById("login-form").style.display = "none";
      document.getElementById("signup-form").style.display = "block";
    });

    document.getElementById("switch-to-login").addEventListener("click", function (event) {
      event.preventDefault();
      document.getElementById("signup-form").style.display = "none";
      document.getElementById("login-form").style.display = "block";
    });

    // Accounts now live in the server's SQLite database (see /backend). The
    // credentials typed here is sent to the server over POST /api/auth/signup
    // and /api/auth/login, where they're verified/hashed with bcrypt — this
    // page never sees or stores a password list itself.

    function setFormBusy(form, busy) {
      const button = form.querySelector('button[type="submit"]');
      if (button) button.disabled = busy;
    }

    // Save registered customers so the admin Customers page can use these records.
    document.getElementById("signupForm").addEventListener("submit", async function (event) {
      event.preventDefault();
      const name = document.getElementById("signup-name").value.trim();
      const email = document.getElementById("signup-email").value.trim().toLowerCase();
      const password = document.getElementById("signup-password").value;
      const confirmPassword = document.getElementById("confirm-password").value;
      if (name.length < 2) return alert("Please enter your full name.");
      if (password.length < 6) return alert("Use a password with at least 6 characters.");
      if (password !== confirmPassword) return alert("Passwords do not match.");

      setFormBusy(this, true);
      try {
        await window.foodHubApi.post("/api/auth/signup", { name, email, password });
        window.foodHubSession.invalidate();
        alert("Account created successfully. Please log in.");
        document.getElementById("signupForm").reset();
        document.getElementById("switch-to-login").click();
      } catch (err) {
        alert(err.message || "Could not create your account.");
      } finally {
        setFormBusy(this, false);
      }
    });

    // Sign in customers or the admin account.
    document.getElementById("loginForm").addEventListener("submit", async function (event) {
      event.preventDefault();
      const email = document.getElementById("login-email").value.trim().toLowerCase();
      const password = document.getElementById("login-password").value;

      setFormBusy(this, true);
      try {
        const { user } = await window.foodHubApi.post("/api/auth/login", { email, password });
        window.foodHubSession.invalidate();

        if (user.role === "admin") {
          window.location.href = "../admin/admin.html";
          return;
        }

        const returnTo = sessionStorage.getItem("foodhubReturnTo");
        sessionStorage.removeItem("foodhubReturnTo");
        window.location.href = returnTo && new URL(returnTo, window.location.href).origin === window.location.origin
          ? returnTo
          : "../home/index.html";
      } catch (err) {
        alert(err.message || "Invalid email or password.");
      } finally {
        setFormBusy(this, false);
      }
    });

    // Show or hide passwords.
    [["toggle-login-password", "login-password"], ["toggle-signup-password", "signup-password"], ["toggle-confirm-password", "confirm-password"]].forEach(function (pair) {
      const toggle = document.getElementById(pair[0]);
      const input = document.getElementById(pair[1]);
      if (!toggle || !input) return;
      toggle.addEventListener("click", function () {
        input.type = input.type === "password" ? "text" : "password";
        toggle.className = input.type === "password" ? "fa fa-eye" : "fa fa-eye-slash";
      });
    });
  </script>

</body>

</html>
