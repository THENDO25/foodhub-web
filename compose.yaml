services:
  foodhub:
    build: .
    container_name: foodhub-app
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/backend/data/foodhub.db
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - foodhub_data:/app/backend/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/products').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  foodhub_data:
