<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login | FoodHub</title>
  <link rel="stylesheet" href="../shared/navbar.css"/>
  <link rel="stylesheet" href="../shared/login.css"/>
  <link rel="stylesheet" href="../shared/responsive.css"/>
  <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/boxicons@2.1.2/css/boxicons.min.css">
  <script src="../shared/navbar.js" defer></script>
</head>

<body>
  <header class="header" id="home">
    <a href="../home/index.html" class="logo">Food<span>Hub</span></a>

    <nav class="navbar">
      <div id="menu-toggle" class="menu-icon" aria-label="Toggle navigation">
        <i id="hamburger-icon" class="fa fa-bars" aria-hidden="true"></i>
        <i id="close-icon" class="fa fa-times" aria-hidden="true"></i>
      </div>
    </nav>
  </header>

  <div class="container">
    <div class="form-container">
      <h2>Admin Login</h2>

      <form id="admin-login-form">
        <input
          type="email"
          id="admin-email"
          placeholder="Email"
          required
        >

        <div class="password-wrapper">
          <input
            type="password"
            id="admin-password"
            placeholder="Password"
            required
          >
          <i
            class="fa fa-eye"
            id="toggle-admin-password"
            style="cursor: pointer;"
            aria-label="Show password"
          ></i>
        </div>
            <div class="rm">
                <label class="remember-pass">
                    <input type="checkbox" id="remember-me">
                    <span class="remember-me-text">Remember Password</span>
                </label>

                <p class="forgotpass">Forgotten password</p>
            </div>

        <button type="submit">Sign in</button>

        <p class="switch-form" id="login-error"></p>
      </form>
    </div>
  </div>
  <script>
    document.getElementById("admin-login-form").addEventListener("submit", function(event) {
        event.preventDefault();

        const email = document.getElementById("admin-email").value.trim().toLowerCase();
        const password = document.getElementById("admin-password").value;
        const error = document.getElementById("login-error");

        if (email === "admin@foodhub.com" && password === "admin123") {

            localStorage.setItem("loggedInUser", email);
            localStorage.setItem("userRole", "admin");

            window.location.href = "index.html";

        } else {
            error.textContent = "Invalid admin email or password.";
            error.style.color = "red";
        }
    });
</script>
</body>
</html>
