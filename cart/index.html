<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart | FoodHub</title>
  <link rel="stylesheet" href="cart.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../shared/navbar.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@2.1.2/css/boxicons.min.css">
    <script src="../shared/navbar.js"></script>
  <script src="../shared/api.js"></script>
  <script src="../shared/session.js"></script>
  <script src="../auth/auth.js"></script>
</head>

<body>
    <header class="header" id="home">
      <a href="../home/index.html" class="logo">Food<span>Hub</span></a>
      <nav class="navbar">
        <div id="menu-toggle" class="menu-icon" aria-label="Toggle navigation">
          <i id="hamburger-icon" class="fa fa-bars" aria-hidden="true"></i>
          <i id="close-icon" class="fa fa-times" aria-hidden="true" style="display: none;"></i>
        </div>
        <div class="navbar-links">
          <ul>
            <li><a href="../home/index.html">Home</a></li>
            <li><a href="../menu/index.html">Menu</a></li>
            <li><a href="../manage-account/profile.html">Account</a></li>
            <li><a href="../reviews/index.html">Reviews</a></li>
            <li><a href="index.html">Cart</a></li>
          </ul>
        </div>
      </nav>
      <a href="../auth/login.html" class="btn auth-btn" id="auth-btn">Sign in</a>
    </header>

  <div class="cart-container">
    <h1>Your Cart</h1>
    <div id="cart-items"></div>
    <div class="cart-summary">
      <h2 id="total">Total: R0.00</h2>
      <button class="checkout-btn">Checkout</button>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div id="checkout-modal" class="checkout-modal hidden">
    <div class="checkout-content">
      <h2>Checkout</h2>
      <form id="checkout-form">
        <input type="text" placeholder="Full Name" id="name" required />
        <input type="email" placeholder="Email" id="email" required />
        <textarea placeholder="Delivery Address" id="address" required></textarea>

        <h3>Payment Method</h3>
        <p class="payment-note">Demo checkout only. FoodHub does not process real card payments.</p>
        <div class="payment-options">
          <label>
            <input type="radio" name="payment" value="card" required />
            Card payment (demo only)
          </label>
          <label>
            <input type="radio" name="payment" value="cod" />
            Cash on Delivery
          </label>
        </div>


        <button type="submit" class="confirm-btn">Place Order</button>
        <button type="button" onclick="closeModal()" class="cancel-btn">Cancel</button>
      </form>
    </div>
  </div>

  <!-- EmailJS and Checkout Script -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    (function () {
      emailjs.init("xQGuJ_tKdG5yXA5yV");
    })();
  </script>

  <script>
   // Cart values are untrusted localStorage data. Render them only with DOM APIs.
   const cartItemsContainer = document.getElementById('cart-items');
   const totalElement = document.getElementById('total');
   function readCart() {
     try {
       const value = JSON.parse(localStorage.getItem('cart') || '[]');
       return Array.isArray(value) ? value.filter(item => item && typeof item === 'object') : [];
     } catch (_) { return []; }
   }
   let cart = readCart();

   function escapeEmailHtml(value) {
     return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
   }
   function safeImageSource(value) {
     const raw = String(value || '').trim();
     if (!raw) return '';
     try {
       const url = new URL(raw, window.location.href);
       return (url.protocol === 'https:' || (url.protocol === 'http:' && url.origin === window.location.origin)) ? url.href : '';
     } catch (_) { return ''; }
   }
   function persistCart() { localStorage.setItem('cart', JSON.stringify(cart)); }

   function renderCart() {
     cartItemsContainer.replaceChildren();
     let total = 0;
     cart.forEach((item, index) => {
       const itemName = String(item.name || item.title || 'Food item');
       const itemImage = safeImageSource(item.image || item.imgSrc);
       const itemPrice = Number(item.price);
       const price = Number.isFinite(itemPrice) && itemPrice >= 0 ? itemPrice : 0;
       const quantity = Math.min(50, Math.max(1, Math.floor(Number(item.quantity) || 1)));
       item.quantity = quantity;
       total += price * quantity;

       const row = document.createElement('div');
       row.className = 'cart-item';
       const image = document.createElement('img');
       image.src = itemImage;
       image.alt = itemName;
       image.loading = 'lazy';
       const details = document.createElement('div');
       details.className = 'item-details';
       const heading = document.createElement('h3');
       heading.textContent = itemName;
       const priceText = document.createElement('p');
       priceText.textContent = `R${price.toFixed(2)}`;
       const quantityControls = document.createElement('div');
       quantityControls.className = 'quantity-controls';
       const minus = document.createElement('button');
       minus.type = 'button';
       minus.textContent = '−';
       minus.setAttribute('aria-label', `Decrease ${itemName} quantity`);
       minus.addEventListener('click', () => updateQuantity(index, -1));
       const quantityText = document.createElement('span');
       quantityText.textContent = String(quantity);
       const plus = document.createElement('button');
       plus.type = 'button';
       plus.textContent = '+';
       plus.setAttribute('aria-label', `Increase ${itemName} quantity`);
       plus.addEventListener('click', () => updateQuantity(index, 1));
       quantityControls.append(minus, quantityText, plus);
       details.append(heading, priceText, quantityControls);
       const remove = document.createElement('button');
       remove.type = 'button';
       remove.className = 'remove-btn';
       remove.textContent = 'Remove';
       remove.addEventListener('click', () => removeItem(index));
       row.append(image, details, remove);
       cartItemsContainer.appendChild(row);
     });
     persistCart();
     totalElement.textContent = `Total: R${total.toFixed(2)}`;
   }

   function updateQuantity(index, change) {
     if (!cart[index]) return;
     const current = Math.min(50, Math.max(1, Math.floor(Number(cart[index].quantity) || 1)));
     const next = current + change;
     if (next < 1) cart.splice(index, 1);
     else cart[index].quantity = Math.min(50, next);
     persistCart();
     renderCart();
   }

   function removeItem(index) {
     if (!Number.isInteger(index) || !cart[index]) return;
     cart.splice(index, 1);
     persistCart();
     renderCart();
   }

   function closeModal() {
     document.getElementById('checkout-modal').classList.add('hidden');
   }
   window.closeModal = closeModal;
   window.updateQuantity = updateQuantity;
   window.removeItem = removeItem;
   renderCart();

// Prefill checkout with the signed-in customer's details.
(async function prefillCheckout() {
  const user = await window.foodHubSession.get();
  if (!user || user.role !== 'customer') return;
  document.getElementById('email').value = user.email;
  document.getElementById('name').value = user.name || '';
  document.getElementById('address').value = user.address || '';
})();

// Show Checkout
document.querySelector('.checkout-btn').addEventListener('click', async () => {
  const user = await window.foodHubSession.get();
  if (!user || user.role !== 'customer') {
    sessionStorage.setItem('foodhubReturnTo', window.location.href);
    alert('Please log in before placing an order.');
    window.location.href = '../auth/login.html';
    return;
  }
  if (cart.length === 0) {
    alert('Your cart is empty!');
    return;
  }
  document.getElementById('checkout-modal').classList.remove('hidden');
});

// Handle Checkout Form Submission
document.getElementById('checkout-form').addEventListener('submit', async function (e) {
  e.preventDefault();

  const user = await window.foodHubSession.get();
  if (!user || user.role !== 'customer') {
    sessionStorage.setItem('foodhubReturnTo', window.location.href);
    alert('Please log in before placing an order.');
    window.location.href = '../auth/login.html';
    return;
  }

  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const address = document.getElementById('address').value.trim();
  if (email.toLowerCase() !== user.email.toLowerCase()) { alert('Please use the email address for your signed-in account.'); return; }

  if (!name || !email || !address) {
    alert('Please fill in all fields.');
    return;
  }

  if (!/\S+@\S+\.\S+/.test(email)) {
    alert('Please enter a valid email address.');
    return;
  }

  const paymentMethod = document.querySelector('input[name="payment"]:checked')?.value || 'cod';
  const submitBtn = document.querySelector('#checkout-form .confirm-btn');
  if (submitBtn) submitBtn.disabled = true;

  // Place the order server-side. The server looks up each item's real price
  // in the database and recomputes the total — the price/total sent from
  // here are never trusted, so this call can't be used to under-pay.
  let order;
  try {
    const result = await window.foodHubApi.post('/api/orders', {
      address,
      paymentMethod,
      items: cart.map(item => ({
        name: item.name || item.title || 'Food item',
        quantity: Number(item.quantity) || 1,
      })),
    });
    order = result.order;
  } catch (err) {
    alert(err.message || 'Could not place your order. Please try again.');
    if (submitBtn) submitBtn.disabled = false;
    return;
  }
  if (submitBtn) submitBtn.disabled = false;

  const orderId = order.id;
  const orderTotal = order.total;

  const emailItems = Array.isArray(order.products) ? order.products : [];
  let orderTableHTML = `
  <table style="width:100%;border-collapse:collapse;">
    <thead><tr style="background-color:#f5f5f5;">
      <th align="left" style="padding:8px;">Image</th>
      <th align="left" style="padding:8px;">Item</th>
      <th align="center" style="padding:8px;">Qty</th>
      <th align="right" style="padding:8px;">Price</th>
    </tr></thead><tbody>`;
  emailItems.forEach(item => {
    const itemName = String(item.name || 'Food item');
    const itemImage = safeImageSource(item.image || item.imgSrc);
    const itemQuantity = Math.min(50, Math.max(1, Math.floor(Number(item.quantity) || 1)));
    const itemPrice = Math.max(0, Number(item.price) || 0);
    orderTableHTML += `<tr>
      <td style="padding:8px;"><img src="${escapeEmailHtml(itemImage)}" alt="${escapeEmailHtml(itemName)}" width="60" style="border-radius:5px;" /></td>
      <td style="padding:8px;">${escapeEmailHtml(itemName)}</td>
      <td align="center" style="padding:8px;">${itemQuantity}</td>
      <td align="right" style="padding:8px;">R${itemPrice.toFixed(2)}</td>
    </tr>`;
  });
  orderTableHTML += '</tbody></table>';

const orderDetails = {
  user_name: escapeEmailHtml(user.name || name),
  user_email: escapeEmailHtml(user.email || email),
  user_address: escapeEmailHtml(address),
  user_total: orderTotal.toFixed(2),
  order_id: orderId,
  order_html: orderTableHTML,
  to_email: email
};


  // Send to user
  if (window.emailjs && typeof emailjs.send === "function") emailjs.send("service_gcfdzxl", "template_ph5ho4r", orderDetails)
    .then(() => {
      console.log("Confirmation email sent to user");
    })
    .catch(err => {
      console.error("Failed to send email to user", err);
    });

  // Send to restaurant
  const restaurantDetails = {
    ...orderDetails,
    to_email: "lmukwevho1125@gmail.com", // restaurant email
  };

  if (window.emailjs && typeof emailjs.send === "function") emailjs.send("service_gcfdzxl", "template_ph5ho4r", restaurantDetails)
    .then(() => {
      console.log("Email sent to restaurant");
      alert(`Thank you for shopping with FoodHub! Order ${orderId} has been placed. A confirmation email has been sent.`);
    })
    .catch(err => {
      console.error("Failed to send email to restaurant", err);
      alert(`Order ${orderId} was placed successfully, but the confirmation email could not be sent.`);
    });

  // Clear cart and close modal
  if (!window.emailjs || typeof emailjs.send !== 'function') alert(`Order ${orderId} was placed successfully. Email confirmation is not configured.`);
  cart = [];
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
  closeModal();
});


  </script>

</body>

</html>
